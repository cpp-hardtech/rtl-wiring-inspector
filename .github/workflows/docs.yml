name: Documentation

on:
  push:
    branches:
      - main

concurrency:
  group: documentation-gh-pages
  cancel-in-progress: false

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules

permissions:
  contents: write

jobs:
  build:
    name: Build and publish documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/cache@v3
        with:
          path: "**/cpm_modules"
          key: ${{ github.workflow }}-cpm-modules-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}

      - name: Install python dependencies
        run: |
          pip3 install jinja2==3.1.6 Pygments==2.19.1

      - uses: ssciwr/doxygen-install@v1
        with:
          version: "1.16.1"

      - name: Build
        run: |
          cmake --preset=docs
          cmake --build build/docs --target docs

      - name: Check publishing revision
        id: publishing-revision
        run: |
          ref=$(git ls-remote --exit-code origin "$GITHUB_REF")
          read -r main_sha _ <<< "$ref"
          if [[ "$GITHUB_SHA" == "$main_sha" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping documentation publication for a superseded main commit."
          fi

      - name: Publish
        if: steps.publishing-revision.outputs.current == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/docs/docs/doxygen/html
