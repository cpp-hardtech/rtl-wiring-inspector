name: Coverage

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux-coverage:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: |
        wget -q https://apt.llvm.org/llvm-snapshot.gpg.key -O "$RUNNER_TEMP/llvm-snapshot.asc"
        sudo install -D -m 0644 "$RUNNER_TEMP/llvm-snapshot.asc" /etc/apt/keyrings/llvm-snapshot.asc
        echo "deb [signed-by=/etc/apt/keyrings/llvm-snapshot.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
        sudo apt-get update
        sudo apt-get install -y clang-21 llvm-21

    # Cache CMake dependencies
    - uses: actions/cache@v3
      with:
        path: "**/_deps"
        key: ${{ github.workflow }}-cmake-deps-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
        restore-keys: |
            ${{ github.workflow }}-cmake-deps-

    - name: Configure CMake
      run: >-
        cmake --preset=clang-coverage
        -DLLVM_PROFDATA_PATH=/usr/bin/llvm-profdata-21
        -DLLVM_COV_PATH=/usr/bin/llvm-cov-21

    - name: Build
      run: cmake --build build/clang-coverage

    - name: Run tests
      run: cmake --build build/clang-coverage -t coverage-run

    - name: Process coverage info
      run: cmake --build build/clang-coverage -t coverage-lcov

    - name: Submit to codecov.io
      uses: codecov/codecov-action@v5
      with:
        files: build/clang-coverage/coverage_output/coverage_report.lcov
        plugins: noop
        disable_search: true
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true
